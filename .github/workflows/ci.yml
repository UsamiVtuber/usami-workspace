name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    name: Rust Check (usami-desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Verify source files
        run: |
          echo "=== Git commit ==="
          git rev-parse HEAD
          echo "=== lol/mod.rs line count ==="
          wc -l usami-desktop/src/lol/mod.rs
          echo "=== eprintln in lol/mod.rs ==="
          grep -n "eprintln!" usami-desktop/src/lol/mod.rs
          echo "=== eprintln in lol/live_client.rs ==="
          grep -n "eprintln!" usami-desktop/src/lol/live_client.rs
          echo "=== mascot.rs imports ==="
          head -20 usami-desktop/src/mascot.rs
          echo "=== presence.rs line 159 ==="
          sed -n '155,165p' usami-desktop/src/presence.rs

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'usami-desktop -> target'

      - name: Check fmt
        run: cargo fmt --all -- --check
        working-directory: usami-desktop

      - name: Run clippy
        run: cargo clippy --workspace --all-targets
        working-directory: usami-desktop

      - name: Build
        run: cargo build --workspace --release
        working-directory: usami-desktop