name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: desktop-v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  # Commit do weebui (gpui-vrm) usado no build; fixo para o binário ser reprodutível.
  GPUI_VRM_REVISION: b063a79216b141562e23da4c71e59c6ad1b7c279
  RELEASE_REPO: UsamiVtuber/usami-desktop

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Checkout gpui-vrm
        uses: actions/checkout@v4
        with:
          repository: Rukafuu/weebui
          ref: ${{ env.GPUI_VRM_REVISION }}
          path: gpui-vrm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: usami-desktop -> target

      - name: Build
        working-directory: usami-desktop
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          if ($tag -match '^desktop-v(.+)$') { $version = $Matches[1] } else { throw "Tag inválida: use desktop-vX.Y.Z" }
          $stage = "dist/usami-desktop-$version-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item usami-desktop/target/release/usami-desktop.exe $stage
          Copy-Item -Recurse usami-desktop/assets $stage/assets
          Copy-Item usami-desktop/PACKAGE_README.md "$stage/README.md"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/usami-desktop-$version-windows-x64.zip"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASES_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            throw "Configure o secret DESKTOP_RELEASES_TOKEN (fine-grained PAT com Contents: write em $env:RELEASE_REPO)."
          }
          gh release create "v$env:VERSION" "dist/usami-desktop-$env:VERSION-windows-x64.zip" `
            --repo "$env:RELEASE_REPO" `
            --title "Usami Desktop $env:VERSION" `
            --target main `
            --notes "Pacote Windows x64. Requer o backend em 127.0.0.1:8787 e um modelo .vrm próprio; instruções no README do zip."
