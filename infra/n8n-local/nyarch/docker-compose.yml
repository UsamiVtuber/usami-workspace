# n8n do Nyarch (notebook Arch) — definido por compose desde 2026-10-25.
# Antes era `docker run` avulso; o compose existe para que o vinculo com a rede do
# code sandbox sobreviva a qualquer recriacao.
#
#   cd ~/n8n && docker compose up -d
#
# A rede do sandbox e externa: pertence a stack em ~/n8n-sandbox, que precisa estar
# de pe antes (`cd ~/n8n-sandbox && docker compose up -d`).
#
# Segredos em ~/n8n/.env (0600): N8N_SANDBOX_SERVICE_API_KEY espelha SANDBOX_API_KEYS
# de ~/n8n-sandbox/.env, e SEARXNG_SECRET e gerado. Nenhum segredo neste arquivo.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.6
    container_name: n8n-usami-inbox
    restart: unless-stopped
    user: node
    depends_on:
      searxng:
        condition: service_started
    ports:
      # Edicao local pela rede do cabo cruzado; nada exposto alem de 10.42.0.0/24.
      - "10.42.0.1:5678:5678"
      - "127.0.0.1:5678:5678"
    environment:
      N8N_PROTOCOL: http
      N8N_HOST: 10.42.0.1
      N8N_PORT: "5678"
      WEBHOOK_URL: http://10.42.0.1:5678
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      # Separador e ponto-e-virgula: o n8n divide restrictFileAccessTo por ';'
      # (getAllowedPaths, em file-system-helper-functions.ts). Com virgula a lista
      # vira UMA entrada invalida e nenhum arquivo do vault e acessivel.
      N8N_RESTRICT_FILE_ACCESS_TO: /files/obsidian/usami;/home/node/vault/Inbox/Automations
      # Usado pelos workflows para localizar o vault montado.
      USAMI_VAULT_PATH: /home/node/vault
      # Code sandbox auto-hospedado (n8n Assistant / Agents).
      N8N_INSTANCE_AI_SANDBOX_ENABLED: "true"
      N8N_INSTANCE_AI_SANDBOX_PROVIDER: n8n-sandbox
      N8N_SANDBOX_SERVICE_URL: http://n8n-sandbox-api:8080
      N8N_SANDBOX_SERVICE_API_KEY: ${N8N_SANDBOX_SERVICE_API_KEY:?defina em ~/n8n/.env}
      # Observabilidade e canais Discord dedicados (usados pelos workflows).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
      N8N_OBSERVABILITY_API_KEY: ${N8N_OBSERVABILITY_API_KEY:-}
      DISCORD_OBS_ERRORS_CHANNEL_ID: ${DISCORD_OBS_ERRORS_CHANNEL_ID:-}
      DISCORD_OBS_SUMMARY_CHANNEL_ID: ${DISCORD_OBS_SUMMARY_CHANNEL_ID:-}
      # Webhook do canal de vagas, lido pelo workflow "Busca e Matching de Vagas"
      # como {{ $env.DISCORD_VAGAS_WEBHOOK_URL }}. Nunca cole a URL no export:
      # ate 2026-11-17 ela estava inline e vazou num repositorio publico.
      DISCORD_VAGAS_WEBHOOK_URL: ${DISCORD_VAGAS_WEBHOOK_URL:-}
    volumes:
      # OS TRES MOUNTS SAO OBRIGATORIOS. Sem eles o n8n sobe num banco vazio dentro
      # do container e parece funcionar normalmente -- foi uma regressao real de 2026-10-25.
      - type: bind
        source: /dados/n8n/data
        target: /home/node/.n8n
        bind:
          create_host_path: false
      - type: bind
        source: /dados/obsidian/usami
        target: /files/obsidian/usami
        bind:
          create_host_path: false
      # SMB do vault (Inbox/Automations). Se /mnt/usami-automations estiver desmontado,
      # o container ve a pasta vazia: confira o mount antes de recriar.
      - type: bind
        source: /mnt/usami-automations
        target: /home/node/vault/Inbox/Automations
        bind:
          create_host_path: false
    networks:
      - n8n
      - sandbox-service

  searxng:
    image: ghcr.io/searxng/searxng:latest
    container_name: n8n-searxng
    restart: unless-stopped
    # Interno: o n8n alcaca por nome de servico. NUNCA publique porta daqui.
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?defina em ~/n8n/.env}
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - n8n

  postgres:
    image: postgres:16-alpine
    container_name: n8n-usami-postgres
    restart: unless-stopped
    # Banco de aplicacao na rede interna (bot Discord + observabilidade).
    # O proprio n8n continua usando /home/node/.n8n/database.sqlite para preservar
    # credenciais e workflows existentes.
    environment:
      POSTGRES_DB: usami
      POSTGRES_USER: usami
      POSTGRES_PASSWORD: ${USAMI_POSTGRES_PASSWORD:?defina em ~/n8n/.env}
    volumes:
      - type: bind
        source: /dados/n8n/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usami -d usami"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - n8n

  discord-bridge:
    build: ./discord-bridge
    container_name: n8n-discord-bridge
    restart: unless-stopped
    depends_on:
      n8n:
        condition: service_started
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_CHAT_CHANNEL_ID: ${DISCORD_CHAT_CHANNEL_ID:-}
      DISCORD_WELCOME_CHANNEL_ID: ${DISCORD_WELCOME_CHANNEL_ID:-}
      DISCORD_SUGGESTIONS_CHANNEL_ID: ${DISCORD_SUGGESTIONS_CHANNEL_ID:-}
      DISCORD_MOD_LOG_CHANNEL_ID: ${DISCORD_MOD_LOG_CHANNEL_ID:-}
      DISCORD_TICKET_CATEGORY_ID: ${DISCORD_TICKET_CATEGORY_ID:-}
      DISCORD_OBS_ERRORS_CHANNEL_ID: ${DISCORD_OBS_ERRORS_CHANNEL_ID:-}
      DISCORD_OBS_SUMMARY_CHANNEL_ID: ${DISCORD_OBS_SUMMARY_CHANNEL_ID:-}
      N8N_DISCORD_CHAT_WEBHOOK: http://n8n:5678/webhook/usami-discord-chat
      N8N_DISCORD_COMMUNITY_WEBHOOK: http://n8n:5678/webhook/usami-discord-community
      N8N_DISCORD_MOD_WEBHOOK: http://n8n:5678/webhook/usami-discord-mod
      N8N_OBSERVABILITY_WEBHOOK: http://n8n:5678/webhook/usami-observability
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
    networks:
      - n8n

networks:
  n8n:
    driver: bridge
  sandbox-service:
    external: true
    name: n8n-sandbox_sandbox-service
