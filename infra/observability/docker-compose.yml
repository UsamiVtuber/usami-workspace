# Langfuse Local Observability Stack para Usami
# Execução local: docker compose up -d
# UI disponível em: http://localhost:3000

services:
  langfuse-postgres:
    image: postgres:16-alpine
    container_name: usami-langfuse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:-langfuse_secret_local}
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5433:5432"

  langfuse-server:
    image: langfuse/langfuse:2
    container_name: usami-langfuse-server
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_POSTGRES_PASSWORD:-langfuse_secret_local}@langfuse-postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-usami_local_langfuse_secret_1234567890}
      SALT: ${LANGFUSE_SALT:-usami_local_salt_1234567890}
      TELEMETRY_ENABLED: "false"

volumes:
  langfuse_postgres_data:

