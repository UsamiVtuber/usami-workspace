[package]
name = "usami-desktop"
version = "0.5.1"
edition = "2024"

[dependencies]
cpal = "0.18.2"
gpui = "0.2.2"
gpui-vrm = { path = "../gpui-vrm" }
reqwest = { version = "0.13.5", features = ["json", "multipart", "stream"] }
rodio = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }

# Presença no Windows (bandeja, atalho global, autostart e topmost). O
# `windows-sys` já chega pela árvore do GPUI e o `raw-window-handle` é o mesmo
# 0.6 que o GPUI usa para expor o HWND; nenhum crate novo entra no build.
[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
