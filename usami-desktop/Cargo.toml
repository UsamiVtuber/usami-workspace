[package]
name = "usami-desktop"
version = "0.2.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
gpui = "0.2.2"
gpui-vrm = { path = "../gpui-vrm" }
reqwest = { version = "0.13.5", features = ["json", "multipart", "stream"] }
rodio = "0.23.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
