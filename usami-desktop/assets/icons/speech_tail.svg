<svg xmlns="http://www.w3.org/2000/svg" width="20" height="11" viewBox="0 0 20 11" fill="none">
  <!-- Rabicho de balão no estilo .bubble.her::after: triângulo para baixo,
       com a mesma cor do corpo e borda só nas laterais visíveis. O topo fica
       coberto pelo balão, então não recebe stroke. -->
  <path d="M0 0 H20 L10 11 Z" fill="#070D1F" fill-opacity="0.85" />
  <path d="M0 0 L10 11 L20 0" stroke="#F9F9FB" stroke-opacity="0.22" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
</svg>
